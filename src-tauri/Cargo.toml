[package]
name = "flywheel"
version = "0.1.0"
description = "A to-do list that keeps time, and tells Discord"
authors = ["dev1f965x"]
edition = "2021"

[lib]
name = "flywheel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "0.2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
